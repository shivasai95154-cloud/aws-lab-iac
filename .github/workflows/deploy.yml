name: deploy-aws-lab

on:
  push:
    branches: [main]
    paths: ["infra/**", "web/**", ".github/workflows/**"]
  pull_request:
    paths: ["infra/**", "web/**"]
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  id-token: write   # needed for GitHub -> AWS login (OIDC)
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.11.0"

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Validate
        run: terraform validate

      - name: Plan
        if: github.event.inputs.action != 'destroy'
        run: terraform plan -var="region=${{ vars.AWS_REGION }}" -out=tfplan

      - name: Apply
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve -var="region=${{ vars.AWS_REGION }}"

      - name: Show website URL
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event.inputs.action == 'apply'
        run: |
          echo "### Website: $(terraform output -raw alb_url)" >> $GITHUB_STEP_SUMMARY
